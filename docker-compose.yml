services:

  leetcode-score-board-db:
    image: postgres
    container_name: leetcode-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/pgsql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - leetcode-score-board-network

  api:
    build:
      context: ./api
    container_name: leetcode-api
    ports:
      - "8080:3000"
    networks:
      - leetcode-score-board-network

  website:
    build:
      context: ./website
    container_name: leetcode-website
    ports: 
      - "4200:4000"
    networks:
      - leetcode-score-board-network

  redis:
    image: redis:8.10.1-alpine3.23
    container_name: leetcode-redis
    ports:
      - "6379:6379"
    networks:
      - leetcode-score-board-network

networks:
  leetcode-score-board-network:
    name: leetcode-network

volumes:
  pgdata:
